<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Request a Session | Sam's Tutoring Hub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-sm" aria-label="Main navigation">
            <div class="container">
                <!-- CUSTOMIZE HERE: use your name or tutoring-center name. -->
                <a class="navbar-brand fw-bold" href="index.html">Sam's Tutoring Hub</a>
                <div class="navbar-nav ms-auto">
                    <a class="nav-link" href="tutors.html">View tutors</a>
                    <a class="nav-link" href="request-form.html" aria-current="page">Request a session</a>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <div class="form-panel mx-auto">
            <p class="eyebrow">Let's make a plan</p>
            <h1 class="h2 mb-2">Request a tutoring session</h1>
            <p class="text-secondary mb-4">Tell us which course you are working on and the date you prefer.</p>
            <form class="row g-3" action="process-request.php" method="post">
                <div class="col-md-6">
                    <label class="form-label" for="course">Course</label>
                    <input class="form-control" id="course" name="course" type="text" placeholder="For example, IS 6465" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="date">Preferred date</label>
                    <input class="form-control" id="date" name="date" type="date" required>
                </div>
                <div class="col-12 pt-2">
                    <button class="btn btn-primary" type="submit">Request session</button>
                    <a class="btn btn-link" href="index.html">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <footer class="site-footer"><div class="container">Peer Tutoring Hub · Learn with one another.</div></footer>
</body>
</html>
